[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-document-search-desktop"
version = "0.2.0"
description = "Desktop Qt Quick per Local Document Search"
requires-python = ">=3.12"
dependencies = ["local-document-search==0.2.0", "PySide6==6.12.0", "PySide6_Pdf==6.12.0.140"]

[project.gui-scripts]
local-document-search-desktop = "local_document_search_desktop.main:main"

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_document_search_desktop = ["qml/*.qml", "qml/**/*.qml", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

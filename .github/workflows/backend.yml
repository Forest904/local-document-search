name: Backend foundations

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/pyproject.toml
      - name: Create isolated test environment
        run: python -m venv .venv
      - run: '"${{ matrix.python }}" -m pip install -r requirements-dev.txt'
      - run: '"${{ matrix.python }}" -m pip check'
      - run: '"${{ matrix.python }}" -m pytest'

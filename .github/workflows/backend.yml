name: Backend and desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/pyproject.toml
            frontend/pyproject.toml
      - name: Create isolated test environment
        run: python -m venv .venv
      - run: '"${{ matrix.python }}" -m pip install -r requirements-dev.txt'
      - run: '"${{ matrix.python }}" -m pip check'
      - run: '"${{ matrix.python }}" -m pytest'
      - name: Verify CLI installation has no Qt dependency
        run: '"${{ matrix.python }}" -c "import importlib.util; assert importlib.util.find_spec(''PySide6'') is None"'
      - name: Install desktop and test dependencies
        run: '"${{ matrix.python }}" -m pip install -e "../frontend[dev]"'
      - name: Install Qt runtime library on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: '"${{ matrix.python }}" -m pip check'
      - name: Desktop Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "${{ matrix.python }}" -c "from PySide6.QtTest import QTest; from PySide6.QtWidgets import QApplication"
          "${{ matrix.python }}" -m pytest ../frontend/tests ../scripts/tests

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-2022
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
          architecture: x64
      - name: Validate version and existing tag
        id: version
        shell: pwsh
        run: |
          $version = (python scripts/package/release_metadata.py version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Versioni incoerenti' }
          $tag = "v$version"
          git fetch origin --tags
          if ($LASTEXITCODE -ne 0) { throw 'Impossibile leggere i tag' }
          $exists = if (git tag --list $tag) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
      - name: Install pinned Inno Setup
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$directory") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup exit $($process.ExitCode)" }
          $compiler = Join-Path $directory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'ISCC.exe mancante' }
          "LDS_ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Build and verify release installer
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          ./scripts/package/build.ps1 -Release -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { throw 'Build release fallita' }
          python scripts/package/release_metadata.py verify --revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Verifica installer fallita' }
      - name: Publish new version
        if: steps.version.outputs.exists == 'false' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $remoteMain = (git ls-remote origin refs/heads/main).Split("`t")[0]
          if ($LASTEXITCODE -ne 0 -or $remoteMain -ne $env:GITHUB_SHA) { throw 'main è avanzata: release annullata' }
          if (git ls-remote --tags origin "refs/tags/$tag") { throw 'Tag già presente: release annullata' }
          $name = "LocalDocumentSearch-$version-windows-x64-setup.exe"
          $installer = Join-Path 'dist' $name
          $checksum = "$installer.sha256"
          $manifest = Join-Path 'dist/public' "$name.manifest.json"
          $digest = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $body = Get-Content -LiteralPath 'scripts/package/RELEASE_NOTES_0.2.1.md' -Raw -Encoding utf8
          if (-not $body.StartsWith("Local Document Search $version ")) { throw 'Note di release non coerenti con la versione' }
          "$body`nCommit di build: $env:GITHUB_SHA. SHA-256 installer: $digest." | Set-Content -LiteralPath $notes -Encoding utf8
          try {
            gh release create $tag $installer $checksum $manifest --draft --target $env:GITHUB_SHA --title "Local Document Search $version" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Creazione draft o upload falliti' }
            $release = gh release view $tag --json assets,isDraft | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Draft release non verificabile' }
            $assets = @($release.assets)
            foreach ($file in @($installer, $checksum, $manifest)) {
              $filename = Split-Path -Leaf $file
              $size = (Get-Item -LiteralPath $file).Length
              if (-not ($assets | Where-Object { $_.name -eq $filename -and $_.size -eq $size })) { throw "Asset mancante o incompleto: $filename" }
            }
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione release fallita' }
          } catch {
            gh release delete $tag --cleanup-tag --yes 2>$null
            if ($LASTEXITCODE -ne 0) { git push origin ":refs/tags/$tag" 2>$null }
            throw
          }

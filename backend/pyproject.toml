[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-document-search"
version = "0.1.0"
description = "Architecture-first scaffold for a local multi-format document search backend"
requires-python = ">=3.12"
readme = "README.md"
authors = []
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

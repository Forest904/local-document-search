[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-document-search"
version = "0.2.2"
description = "Foundations for a local multi-format document search backend"
requires-python = ">=3.12"
readme = "README.md"
authors = []
dependencies = ["markdown-it-py==4.2.0", "pypdf==7.0.0"]

[project.scripts]
local-document-search = "local_document_search.interfaces.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
